<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool of Radiance</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #f55; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="err"></div>
<script type="module">
  import { MainProgram } from './engine/main.js';
  const c = document.getElementById('screen');
  // integer scaling, nearest neighbour (BUILD_PLAN §1)
  function fit() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / 320, innerHeight / 200)));
    c.style.width = 320 * s + 'px'; c.style.height = 200 * s + 'px';
  }
  addEventListener('resize', fit); fit();
  MainProgram(c).catch((e) => {
    if (String(e && e.message) === 'TerminateGame') return;
    // already reported (drawn on the game screen, stored in localStorage por:lastError / por:errors) by engine/errors.js
    document.getElementById('err').textContent = String(e && e.stack || e);
    window.__screenReady = true;   // a stopped program is the final screen for headless runs
  });
</script>
</body>
</html>
