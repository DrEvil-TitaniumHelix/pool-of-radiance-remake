<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Screens Harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { image-rendering: pixelated; display: block; width: 640px; height: 400px; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #f55; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="err"></div>
<script type="module">
  // Acceptance harness for COMBAT screen ids: screens.html?screen=CH-02 (see harness.js SCREENS).
  import { run } from './harness.js';
  run(document.getElementById('screen')).catch((e) => {
    document.getElementById('err').textContent = String(e && e.stack || e);
    console.error(e);
  });
</script>
</body>
</html>
